
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHP Practical Programs</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#edf1f7;font:15px/1.7 Arial,sans-serif}
header{padding:25px 6%;background:#111621;border-bottom:1px solid #293244}

header p{color:#aab5c6}
main{max-width:1050px;margin:auto;padding:25px}
.toolbar{padding:18px 0;border-bottom:1px solid #293244}
button{padding:10px 14px;margin:4px 5px 4px 0;border:0;border-radius:6px;background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}

button:hover{opacity:.85}
.status{display:block;margin:8px 0;color:#aab5c6;font-size:13px}

.status.error{color:#fb7185}

.practical{padding:25px 0;border-bottom:1px solid #293244;scroll-margin-top:20px}
h2{font-size:22px;color:#c4b5fd}
h3{font-size:16px;color:#e2e8f0;margin-bottom:5px}

details{margin-top:15px}
summary{cursor:pointer;color:#c4b5fd;font-weight:bold;padding:8px 0}
.output{padding:18px;background:#fff;color:#111;border-radius:7px;margin-top:8px}
.output input{margin:5px 0;padding:6px;max-width:100%}
.output button{background:#2563eb}
.output img{max-width:100%;width:300px;display:block;border-radius:5px}

.output .result{margin-top:12px;color:#111}
.note{color:#aab5c6;font-size:13px}

.quick-nav{padding:16px 0;border-bottom:1px solid #293244}
.quick-nav strong{display:block;color:#c4b5fd;margin-bottom:8px}
.quick-nav a{display:inline-block;text-decoration:none;color:#e2e8f0;background:#202736;border:1px solid #394357;border-radius:6px;padding:7px 10px;margin:4px 5px 4px 0}
.quick-nav a:hover{background:#8b5cf6;color:white}
.ad-choice{background:#202736!important;border:1px solid #394357!important}
.ad-choice.active{background:#8b5cf6!important}

@media(max-width:600px){
main{padding:15px}
header{padding:20px}
.quick-nav a{font-size:13px}
}
</style>
</head>

<body>

<header>
<h1>PHP Practical Programs</h1>
<p>Source Code · Sample Output · Individual Downloads</p>
</header>

<main>

<div class="toolbar">
<button id="chooseFolder">Choose htdocs Folder Once</button>
<span id="folderStatus" class="status">No folder selected.</span>
<p class="note">Select your XAMPP htdocs folder once. Keep this page open while downloading.</p>
</div>

<nav class="quick-nav" aria-label="Quick navigation">
<strong>Quick Navigation</strong>
<div id="quickLinks"></div>
</nav>

<div id="programs"></div>
</main>

<script>
const programs = [

{
title:"1. Greeting",
aim:"To write a php program to Get the name of the user from a form and show “greeting text”.",
file:"Greeting.php",
code:`<!DOCTYPE html>
<html>
<body>
<form method="post">
    Enter your name:
    <input type="text" name="name">
    <input type="submit" value="Submit">
</form>
<?php
if (isset($_POST['name'])) {
    $name = $_POST['name'];
    echo "Hello, $name! Welcome!";
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();this.nextElementSibling.textContent='Hello, '+this.elements.name.value+'! Welcome!'">
Enter your name:
<input type="text" name="name" placeholder="Enter your name">
<input type="submit" value="Submit">
</form><div class="result"></div>`
},

{
title:"2. Palindrome",
aim:"To Write a PHP program to check whether the given string is a palindrome or not.",
file:"Palindrome.php",
code:`<!DOCTYPE html>
<html>
<body>
<form method="post">
    Enter a string:
    <input type="text" name="str">
    <input type="submit" value="Check">
</form>
<?php
if (isset($_POST['str'])) {
    $str = $_POST['str'];
    $reverse = strrev($str);
    if ($str == $reverse) {
        echo "The ".$str." is a Palindrome";
    } else {
        echo "The ".$str." string is not a Palindrome";
    }
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();let s=this.elements.str.value;this.nextElementSibling.textContent=s===s.split('').reverse().join('')?'The '+s+' is a Palindrome':'The '+s+' string is not a Palindrome'">
Enter a string:
<input type="text" name="str" placeholder="Example: madam">
<input type="submit" value="Check">
</form><div class="result"></div>`
},

{
title:"3. Program using function",
aim:"To Write a PHP program using function.",
file:"Function.php",
code:`<html>
<body>
<form method="post">
    Enter your name:
    <input type="text" name="name">
    <input type="submit" value="Submit">
</form>
<?php
function greet($name)
{
    echo "Hello, " . $name;
}
if (isset($_POST['name'])) {
    greet($_POST['name']);
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();this.nextElementSibling.textContent='Hello, '+this.elements.name.value">
Enter your name:
<input type="text" name="name" placeholder="Enter your name">
<input type="submit" value="Submit">
</form><div class="result"></div>`
},

{
title:"4. Array Manipulation",
aim:"Write a PHP program for array manipulation.",
file:"ArrayManipulation.php",
code:`<?php
$fruits = array("Apple", "Mango", "Orange");
echo "Fruits:<br>";
foreach ($fruits as $fruit) {
    echo $fruit . "<br>";
}
?>`,
output:`<div>Fruits:<br>Apple<br>Mango<br>Orange</div>`
},

{
title:"5. Personal Information",
aim:"Write a PHP program to design Personal Information.",
file:"PersonalInformation.php",
code:`<!DOCTYPE html>
<html>
<body>
<h2>Personal Information</h2>
<form method="post">
    Name:
    <input type="text" name="name"><br><br>
    Age:
    <input type="number" name="age"><br><br>
    Email:
    <input type="email" name="email"><br><br>
    <input type="submit" value="Submit">
</form>
<?php
if (isset($_POST['name'])) {
    echo "<h3>Personal Information</h3>";
    echo "Name: " . $_POST['name'] . "<br>";
    echo "Age: " . $_POST['age'] . "<br>";
    echo "Email: " . $_POST['email'];
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();let f=this;let r=this.nextElementSibling;r.innerHTML='<h3>Personal Information</h3>Name: '+esc(f.elements.name.value)+'<br>Age: '+esc(f.elements.age.value)+'<br>Email: '+esc(f.elements.email.value)">
Name:
<input type="text" name="name"><br><br>
Age:
<input type="number" name="age"><br><br>
Email:
<input type="email" name="email"><br><br>
<input type="submit" value="Submit">
</form><div class="result"></div>`
},

{
title:"6. Advertisement",
aim:"Create a web page to advertise product of the company using images and audio.",
file:"Advertisement.php",
code:`<html>
<body>
<h1>Our Product</h1>
<img src="Products/product.jfif" width="300">
<h2>New Product Available!</h2>
<p>Buy our product today at the best price.</p>
<audio controls>
    <source src="music.wav" type="audio/wav">
</audio>
<?php
echo "Thank you for visiting this page";
?>
</body>
</html>`,
output:`<h1>Our Product</h1>
<button type="button" class="ad-choice active" onclick="selectAdImage('bottle')">Bottle Advertisement</button>
<button type="button" class="ad-choice" onclick="selectAdImage('cake')">Aesthetic Cake Advertisement</button>
<br><br>
<img id="sampleProduct" alt="Product advertisement image" width="300">
<h2>New Product Available!</h2>
<p>Buy our product today at the best price.</p>
<audio id="sampleAudio" controls></audio>
<p>Thank you for visiting this page</p>
<p class="note">The downloaded PHP program uses an image from the Products folder and music.wav. Each download is assigned the next available product image filename.</p>`
}
];

let folderHandle = null;
let selectedAdStyle = "bottle";
const $ = id => document.getElementById(id);

function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

function render(){
    $("programs").innerHTML = programs.map((p,i)=>`
    <section class="practical" id="program${i}">
      <h2>${p.title}</h2>
      <h3>AIM:</h3>
      <p>${p.aim}</p>

      <button class="secondary" onclick="copyCode(${i})">Copy Code</button>
      <button onclick="downloadProgram(${i})">Download ${p.file}</button>
      <span id="status${i}" class="status" aria-live="polite">Ready to download.</span>

      <details>
        <summary>View Source Code</summary>
        <h3>Program:</h3>
        <pre>${esc(p.code)}</pre>
      </details>

      <details>
        <summary>View Sample Output</summary>
        <h3>Output:</h3>
        <div class="output" id="output${i}">${p.output}</div>
      </details>
    </section>`).join("");

    $("quickLinks").innerHTML = programs.map((p,i)=>
        `<a href="#program${i}">${p.title}</a>`
    ).join("");

    setupAdvertisementSample();
}

function drawProductCanvas(style){
    const canvas=document.createElement("canvas");
    canvas.width=900;
    canvas.height=600;
    const c=canvas.getContext("2d");

    // Premium background
    const bg=c.createLinearGradient(0,0,900,600);
    bg.addColorStop(0,"#f8e9d2");
    bg.addColorStop(0.55,"#ead1b1");
    bg.addColorStop(1,"#b7a0a0");
    c.fillStyle=bg;
    c.fillRect(0,0,900,600);

    // Decorative background circles
    c.globalAlpha=0.22;
    c.fillStyle="#ffffff";
    c.beginPath();
    c.arc(735,110,115,0,Math.PI*2);
    c.fill();
    c.beginPath();
    c.arc(150,500,145,0,Math.PI*2);
    c.fill();
    c.globalAlpha=1;

    c.fillStyle="#46302b";
    c.textAlign="left";
    c.font="bold 27px Arial";
    c.fillText("PREMIUM COLLECTION",55,78);

    c.fillStyle="#70534a";
    c.font="20px Arial";
    c.fillText("Made to make your day special",55,113);

    if(style==="cake"){
        // Cake stand
        c.fillStyle="#b68c72";
        c.beginPath();
        c.ellipse(590,475,205,28,0,0,Math.PI*2);
        c.fill();

        c.fillStyle="#f5e9dc";
        c.beginPath();
        c.ellipse(590,462,185,23,0,0,Math.PI*2);
        c.fill();

        // Cake body
        c.fillStyle="#f4d7cf";
        c.beginPath();
        c.moveTo(445,300);
        c.lineTo(735,300);
        c.lineTo(715,430);
        c.quadraticCurveTo(590,465,465,430);
        c.closePath();
        c.fill();

        // Chocolate topping and cream
        c.fillStyle="#7b463c";
        c.beginPath();
        c.ellipse(590,295,143,38,0,0,Math.PI*2);
        c.fill();

        c.fillStyle="#fff0e8";
        c.beginPath();
        c.ellipse(590,286,139,35,0,0,Math.PI*2);
        c.fill();

        // Strawberry decorations
        [[535,275],[590,260],[642,276]].forEach((p,i)=>{
            c.fillStyle=i===1?"#b83b4b":"#d94b5b";
            c.beginPath();
            c.ellipse(p[0],p[1],17,22,i===1?0.2:-0.2,0,Math.PI*2);
            c.fill();

            c.fillStyle="#52754b";
            c.beginPath();
            c.ellipse(p[0],p[1]-19,8,4,-0.5,0,Math.PI*2);
            c.fill();
        });

        // Cake product label
        c.fillStyle="#fffaf3";
        c.fillRect(505,350,170,52);
        c.strokeStyle="#c39a7d";
        c.lineWidth=2;
        c.strokeRect(505,350,170,52);

        c.fillStyle="#69453b";
        c.textAlign="center";
        c.font="bold 22px Georgia";
        c.fillText("SWEET MOMENT",590,373);
        c.font="14px Arial";
        c.fillText("ARTISAN CAKE",590,391);

    }else{
        // Bottle shadow
        c.fillStyle="rgba(66,43,35,0.18)";
        c.beginPath();
        c.ellipse(600,500,125,22,0,0,Math.PI*2);
        c.fill();

        // Golden bottle cap
        c.fillStyle="#b58b4a";
        c.fillRect(548,160,104,46);
        c.fillStyle="#e5c98c";
        c.fillRect(558,166,84,8);

        // Green glass bottle
        const neck=c.createLinearGradient(540,0,660,0);
        neck.addColorStop(0,"#3c554c");
        neck.addColorStop(0.5,"#8ca99a");
        neck.addColorStop(1,"#2e453e");

        c.fillStyle=neck;
        c.fillRect(540,200,120,55);

        c.beginPath();
        c.moveTo(540,245);
        c.lineTo(515,275);
        c.quadraticCurveTo(495,290,495,320);
        c.lineTo(495,450);
        c.quadraticCurveTo(495,480,525,480);
        c.lineTo(675,480);
        c.quadraticCurveTo(705,480,705,450);
        c.lineTo(705,320);
        c.quadraticCurveTo(705,290,685,275);
        c.lineTo(660,245);
        c.closePath();
        c.fill();

        // Glass reflection
        c.fillStyle="rgba(255,255,255,0.22)";
        c.beginPath();
        c.moveTo(525,300);
        c.quadraticCurveTo(520,280,540,270);
        c.lineTo(550,270);
        c.lineTo(550,450);
        c.quadraticCurveTo(550,462,535,458);
        c.closePath();
        c.fill();

        // Bottle label
        c.fillStyle="#f5e6c9";
        c.fillRect(515,335,170,100);
        c.strokeStyle="#b58b4a";
        c.lineWidth=3;
        c.strokeRect(515,335,170,100);

        c.fillStyle="#30463c";
        c.textAlign="center";
        c.font="bold 20px Georgia";
        c.fillText("OUR PRODUCT",600,370);

        c.strokeStyle="#b58b4a";
        c.lineWidth=1;
        c.beginPath();
        c.moveTo(540,383);
        c.lineTo(660,383);
        c.stroke();

        c.font="15px Arial";
        c.fillText("PREMIUM BLEND",600,408);
    }

    // Advertisement slogan
    c.textAlign="left";
    c.fillStyle="#46302b";
    c.font="bold 30px Georgia";
    c.fillText(
        style==="cake"?"A LITTLE SLICE OF JOY":"A TOUCH OF LUXURY",
        55,505
    );

    c.font="18px Arial";
    c.fillStyle="#70534a";
    c.fillText("Discover something beautiful today",55,540);

    return canvas;
}

function selectAdImage(style){
    selectedAdStyle=style;

    const canvas=drawProductCanvas(style);
    const img=$("sampleProduct");

    if(img){
        img.src=canvas.toDataURL("image/jpeg",0.92);
    }

    document.querySelectorAll(".ad-choice").forEach(b=>{
        b.classList.toggle(
            "active",
            b.textContent.toLowerCase().includes(
                style==="cake"?"cake":"bottle"
            )
        );
    });
}

function setupAdvertisementSample(){
    selectAdImage(selectedAdStyle);

    const audio=$("sampleAudio");

    if(audio){
        const wav=makeWav();
        audio.src=URL.createObjectURL(
            new Blob([wav],{type:"audio/wav"})
        );
    }
}

async function productImageBlob(){
    return await new Promise(resolve=>
        drawProductCanvas(selectedAdStyle).toBlob(
            resolve,"image/jpeg",0.92
        )
    );
}

async function copyCode(i){
    const status=$("status"+i);

    try{
        await navigator.clipboard.writeText(programs[i].code);
        status.className="status success";
        status.textContent="Code copied successfully!";
    }catch(e){
        status.className="status error";
        status.textContent="Copy failed. Try opening this page in Chrome or Edge.";
    }
}

function setStatus(i,message,type="loading"){
    const s=$("status"+i);
    s.className="status "+type;
    s.textContent=message;
}

function downloadNormally(filename,content,type="text/plain"){
    const url=URL.createObjectURL(new Blob([content],{type}));
    const a=document.createElement("a");
    a.href=url;
    a.download=filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
}

async function saveFile(filename,content,type="text/plain"){
    const handle=await folderHandle.getFileHandle(filename,{create:true});
    const writable=await handle.createWritable();
    await writable.write(new Blob([content],{type}));
    await writable.close();
}

function makeWav(){
    const rate=8000,samples=rate;
    const buffer=new ArrayBuffer(44+samples);
    const v=new DataView(buffer);

    function str(offset,s){
        for(let i=0;i<s.length;i++){
            v.setUint8(offset+i,s.charCodeAt(i));
        }
    }

    str(0,"RIFF");
    v.setUint32(4,36+samples,true);
    str(8,"WAVE");
    str(12,"fmt ");
    v.setUint32(16,16,true);
    v.setUint16(20,1,true);
    v.setUint16(22,1,true);
    v.setUint32(24,rate,true);
    v.setUint32(28,rate,true);
    v.setUint16(32,1,true);
    v.setUint16(34,8,true);
    str(36,"data");
    v.setUint32(40,samples,true);

    for(let i=0;i<samples;i++){
        v.setUint8(
            44+i,
            128+Math.round(25*Math.sin(2*Math.PI*440*i/rate))
        );
    }

    return buffer;
}

async function getNextProductFilename(){
    // The PHP endpoint stores one shared counter on the server, so different
    // devices receive the next available image name rather than starting over.
    const response = await fetch("next-product.php", {cache:"no-store"});
    if(!response.ok) throw new Error("Could not get the next product filename from the server.");
    const data = await response.json();
    if(!data.filename) throw new Error(data.error || "No product image filename was returned.");
    return data.filename;
}

function advertisementCode(filename){
    return programs[5].code.replace(
        'src="Products/product.jfif"',
        'src="Products/'+filename.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'"'
    );
}

async function downloadProductAsset(filename){
    const response = await fetch("Products/" + encodeURIComponent(filename), {cache:"no-store"});
    if(!response.ok) throw new Error("Could not load Products/" + filename + ". Check the filename and folder path.");
    return await response.blob();
}

async function downloadProgram(i){
    const p=programs[i];
    setStatus(i,"Downloading...");

    try{
        if(i===5){
            // Filename allocation is shared by all users only when this page
            // and next-product.php run on the same PHP server.
            const imageFilename = await getNextProductFilename();
            const imageBlob = await downloadProductAsset(imageFilename);
            const phpCode = advertisementCode(imageFilename);

            if(folderHandle){
                await saveFile(p.file,phpCode,"text/plain");
                const productsFolder = await folderHandle.getDirectoryHandle("Products", {create:false});
                const imageHandle = await productsFolder.getFileHandle(imageFilename,{create:true});
                const writable = await imageHandle.createWritable();
                await writable.write(imageBlob);
                await writable.close();
                await saveFile("music.wav",makeWav(),"audio/wav");
                setStatus(i,"Downloaded successfully: Advertisement.php, Products/"+imageFilename+" and music.wav","success");
            }else{
                downloadNormally(p.file,phpCode,"text/plain");
                downloadNormally(imageFilename,imageBlob,"image/jpeg");
                downloadNormally("music.wav",makeWav(),"audio/wav");
                setStatus(i,"Download started: Advertisement.php, "+imageFilename+" and music.wav. Keep the image in the Products folder when running the PHP file.","success");
            }
            return;
        }

        if(folderHandle){
            await saveFile(p.file,p.code,"text/plain");
            setStatus(i,"Downloaded successfully: "+p.file,"success");
        }else{
            downloadNormally(p.file,p.code,"text/plain");
            setStatus(i,"Download started. Check your browser Downloads.","success");
        }
    }catch(e){
        console.error(e);
        setStatus(i,e.message || "Download failed. Check folder permissions and try again.","error");
    }
}

$("chooseFolder").addEventListener("click",async()=>{
    if(!window.showDirectoryPicker){
        $("folderStatus").textContent=
            "Folder picker unavailable. Downloads will use your browser's Downloads folder.";
        $("folderStatus").className="status error";
        return;
    }

    try{
        const selected=await window.showDirectoryPicker({
            mode:"readwrite"
        });

        if(selected.name.toLowerCase()!=="htdocs"){
            $("folderStatus").textContent=
                "Please select the actual htdocs folder.";
            $("folderStatus").className="status error";
            return;
        }

        if(!confirm("Confirm that the selected folder is C:\\xampp\\htdocs.")){
            return;
        }

        folderHandle=selected;
        $("folderStatus").textContent=
            "htdocs folder selected. Ready to download.";
        $("folderStatus").className="status success";

    }catch(e){
        if(e.name!=="AbortError"){
            $("folderStatus").textContent=
                "Could not select folder. Try again.";
            $("folderStatus").className="status error";
        }
    }
});

render();
</script>
</body>
</html>
