<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHP Practical Programs</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0d12;color:#edf1f7;font:15px/1.7 Arial,sans-serif}
header{padding:25px 6%;background:#111621;border-bottom:1px solid #293244}
header h1{margin:0;color:#c4b5fd}
header p{color:#aab5c6}
main{max-width:1050px;margin:auto;padding:25px}
.toolbar{padding:18px 0;border-bottom:1px solid #293244}
button{padding:10px 14px;margin:4px 5px 4px 0;border:0;border-radius:6px;
background:#8b5cf6;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#202736;border:1px solid #394357}
button:hover{opacity:.85}
.status{display:block;margin:8px 0;color:#aab5c6;font-size:13px}
.status.success{color:#34d399}
.status.error{color:#fb7185}
.status.loading{color:#fbbf24}
.practical{padding:25px 0;border-bottom:1px solid #293244}
h2{font-size:22px;color:#c4b5fd}
h3{font-size:16px;color:#e2e8f0;margin-bottom:5px}
pre{padding:16px;background:#07090e;border:1px solid #293244;
border-radius:8px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;
color:#dbeafe;font-size:13px}
details{margin-top:15px}
summary{cursor:pointer;color:#c4b5fd;font-weight:bold;padding:8px 0}
.output{padding:18px;background:#fff;color:#111;border-radius:7px;margin-top:8px}
.output input{margin:5px 0;padding:6px;max-width:100%}
.output button{background:#2563eb}
.output img{max-width:300px;width:100%}
.output audio{max-width:100%}
.output .result{margin-top:12px;color:#111}
.note{color:#aab5c6;font-size:13px}
@media(max-width:600px){main{padding:15px}header{padding:20px}}
</style>
</head>
<body>

<header>
<h1>PHP Practical Programs</h1>
<p>Source Code · Sample Output · Individual Downloads</p>
</header>

<main>
<div class="toolbar">
<button id="chooseFolder">Choose htdocs Folder Once</button>
<span id="folderStatus" class="status">No folder selected.</span>
<p class="note">Select your XAMPP htdocs folder once. Keep this page open while downloading.</p>
</div>

<div id="programs"></div>
</main>

<script>
const programs = [
{
title:"1. Greeting",
aim:"To write a php program to Get the name of the user from a form and show “greeting text”.",
file:"Greeting.php",
code:`<!DOCTYPE html>
<html>
<body>
<form method="post">
    Enter your name:
    <input type="text" name="name">
    <input type="submit" value="Submit">
</form>
<?php
if (isset($_POST['name'])) {
    $name = $_POST['name'];
    echo "Hello, $name! Welcome!";
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();this.nextElementSibling.textContent='Hello, '+this.elements.name.value+'! Welcome!'">
Enter your name:
<input type="text" name="name" placeholder="Enter your name">
<input type="submit" value="Submit">
</form><div class="result"></div>`
},
{
title:"2. Palindrome",
aim:"To Write a PHP program to check whether the given string is a palindrome or not.",
file:"Palindrome.php",
code:`<!DOCTYPE html>
<html>
<body>
<form method="post">
    Enter a string:
    <input type="text" name="str">
    <input type="submit" value="Check">
</form>
<?php
if (isset($_POST['str'])) {
    $str = $_POST['str'];
    $reverse = strrev($str);
    if ($str == $reverse) {
        echo "The ".$str." is a Palindrome";
    } else {
        echo "The ".$str." string is not a Palindrome";
    }
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();let s=this.elements.str.value;this.nextElementSibling.textContent=s===s.split('').reverse().join('')?'The '+s+' is a Palindrome':'The '+s+' string is not a Palindrome'">
Enter a string:
<input type="text" name="str" placeholder="Example: madam">
<input type="submit" value="Check">
</form><div class="result"></div>`
},
{
title:"3. Program using function",
aim:"To Write a PHP program using function.",
file:"Function.php",
code:`<html>
<body>
<form method="post">
    Enter your name:
    <input type="text" name="name">
    <input type="submit" value="Submit">
</form>
<?php
function greet($name)
{
    echo "Hello, " . $name;
}
if (isset($_POST['name'])) {
    greet($_POST['name']);
}
?>
</body>
</html>`,
output:`<form onsubmit="event.preventDefault();this.nextElementSibling.textContent='Hello, '+this.elements.name.value">
Enter your name:
<input type="text" name="name" placeholder="Enter your name">
<input type="submit" value="Submit">
</form><div class="result"></div>`
},
{
title:"4. Array Manipulation",
aim:"Write a PHP program for array manipulation.",
file:"ArrayManipulation.php",
code:`<?php
$fruits = array("Apple", "Mango", "Orange");
echo "Fruits:<br>";
foreach ($fruits as $fruit) {
    echo $fruit . "<br>";
}
?>`,
output:`<div>Fruits:<br>Apple<br>Mango<br>Orange</div>`
},
{
title:"5. Personal Information",
aim:"Write a PHP program to design Personal Information.",
file:"PersonalInformation.php",
code:`<!DOCTYPE html>
<html>
<body>
<h2>Personal Information</h2>
<form method="post">
    Name:
    <input type="text" name="name"><br><br>
    Age:
    <input type="number" name="age"><br><br>
    Email:
    <input type="email" name="email"><br><br>
    <input type="submit" value="Submit">
</form>
<?php
if (isset($_POST['name'])) {
    echo "<h3>Personal Information</h3>";
    echo "Name: " . $_POST['name'] . "<br>";
    echo "Age: " . $_POST['age'] . "<br>";
    echo "Email: " . $_POST['email'];
}
?>
</body>
</html>`,
output:`<h3>Personal Information</h3>
<form onsubmit="event.preventDefault();let f=this;let r=this.nextElementSibling;r.innerHTML='<h3>Personal Information</h3>Name: '+esc(f.elements.name.value)+'<br>Age: '+esc(f.elements.age.value)+'<br>Email: '+esc(f.elements.email.value)">
Name:
<input type="text" name="name"><br><br>
Age:
<input type="number" name="age"><br><br>
Email:
<input type="email" name="email"><br><br>
<input type="submit" value="Submit">
</form><div class="result"></div>`
},
{
title:"6. Advertisement",
aim:"Create a web page to advertise product of the company using images and audio.",
file:"Advertisement.php",
code:`<html>
<body>
<h1>Our Product</h1>
<img src="product.jpg" width="300">
<h2>New Product Available!</h2>
<p>Buy our product today at the best price.</p>
<audio controls>
    <source src="music.wav" type="audio/wav">
</audio>
<?php
echo "Thank you for visiting this page";
?>
</body>
</html>`,
output:`<h1>Our Product</h1>
<img id="sampleProduct" alt="Product image" width="300">
<h2>New Product Available!</h2>
<p>Buy our product today at the best price.</p>
<audio id="sampleAudio" controls></audio>
<p>Thank you for visiting this page</p>
<p class="note">The downloaded PHP program uses product.jpg and music.wav from the same folder.</p>`
}
];

let folderHandle = null;
const $ = id => document.getElementById(id);

function esc(s){
    return String(s).replace(/[&<>"']/g,c=>({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
}

function render(){
    $("programs").innerHTML = programs.map((p,i)=>`
    <section class="practical" id="program${i}">
      <h2>${p.title}</h2>
      <h3>AIM:</h3>
      <p>${p.aim}</p>

      <button class="secondary" onclick="copyCode(${i})">Copy Code</button>
      <button onclick="downloadProgram(${i})">Download ${p.file}</button>
      <span id="status${i}" class="status" aria-live="polite">Ready to download.</span>

      <details>
        <summary>View Source Code</summary>
        <h3>Program:</h3>
        <pre>${esc(p.code)}</pre>
      </details>

      <details>
        <summary>View Sample Output</summary>
        <h3>Output:</h3>
        <div class="output" id="output${i}">${p.output}</div>
      </details>
    </section>`).join("");

    setupAdvertisementSample();
}

function setupAdvertisementSample(){
    const canvas=document.createElement("canvas");
    canvas.width=600;canvas.height=400;
    const c=canvas.getContext("2d");
    const g=c.createLinearGradient(0,0,600,400);
    g.addColorStop(0,"#312e81");
    g.addColorStop(1,"#a855f7");
    c.fillStyle=g;c.fillRect(0,0,600,400);
    c.fillStyle="#fff";c.font="bold 48px Arial";
    c.fillText("OUR PRODUCT",105,180);
    c.font="25px Arial";c.fillText("New Product Available!",105,235);

    $("sampleProduct").src=canvas.toDataURL("image/jpeg");

    const audio=document.getElementById("sampleAudio");
    if(audio){
        const wav=makeWav();
        audio.src=URL.createObjectURL(new Blob([wav],{type:"audio/wav"}));
    }
}

async function copyCode(i){
    const status=$("status"+i);
    try{
        await navigator.clipboard.writeText(programs[i].code);
        status.className="status success";
        status.textContent="Code copied successfully!";
    }catch(e){
        status.className="status error";
        status.textContent="Copy failed. Try opening this page in Chrome or Edge.";
    }
}

function setStatus(i,message,type="loading"){
    const s=$("status"+i);
    s.className="status "+type;
    s.textContent=message;
}

function downloadNormally(filename,content,type="text/plain"){
    const url=URL.createObjectURL(new Blob([content],{type}));
    const a=document.createElement("a");
    a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
}

async function saveFile(filename,content,type="text/plain"){
    const handle=await folderHandle.getFileHandle(filename,{create:true});
    const writable=await handle.createWritable();
    await writable.write(new Blob([content],{type}));
    await writable.close();
}

function makeWav(){
    const rate=8000, samples=rate;
    const buffer=new ArrayBuffer(44+samples);
    const v=new DataView(buffer);

    function str(offset,s){
        for(let i=0;i<s.length;i++)v.setUint8(offset+i,s.charCodeAt(i));
    }

    str(0,"RIFF");v.setUint32(4,36+samples,true);
    str(8,"WAVE");str(12,"fmt ");
    v.setUint32(16,16,true);v.setUint16(20,1,true);
    v.setUint16(22,1,true);v.setUint32(24,rate,true);
    v.setUint32(28,rate,true);v.setUint16(32,1,true);
    v.setUint16(34,8,true);str(36,"data");
    v.setUint32(40,samples,true);

    for(let i=0;i<samples;i++){
        v.setUint8(44+i,128+Math.round(
            25*Math.sin(2*Math.PI*440*i/rate)
        ));
    }
    return buffer;
}

async function downloadProgram(i){
    const p=programs[i];
    setStatus(i,"Downloading...");

    try{
        if(folderHandle){
            await saveFile(p.file,p.code,"text/plain");

            if(i===5){
                const canvas=document.createElement("canvas");
                canvas.width=600;canvas.height=400;
                const c=canvas.getContext("2d");
                const g=c.createLinearGradient(0,0,600,400);
                g.addColorStop(0,"#312e81");
                g.addColorStop(1,"#a855f7");
                c.fillStyle=g;c.fillRect(0,0,600,400);
                c.fillStyle="#fff";c.font="bold 48px Arial";
                c.fillText("OUR PRODUCT",105,180);
                c.font="25px Arial";c.fillText("New Product Available!",105,235);

                const imageBlob=await new Promise(resolve=>
                    canvas.toBlob(resolve,"image/jpeg",0.9)
                );

                await saveFile("product.jpg",imageBlob,"image/jpeg");
                await saveFile("music.wav",makeWav(),"audio/wav");

                setStatus(i,"Downloaded successfully: Advertisement.php, product.jpg and music.wav","success");
            }else{
                setStatus(i,"Downloaded successfully: "+p.file,"success");
            }
        }else{
            downloadNormally(p.file,p.code,"text/plain");

            if(i===5){
                const canvas=document.createElement("canvas");
                canvas.width=600;canvas.height=400;
                const c=canvas.getContext("2d");
                const g=c.createLinearGradient(0,0,600,400);
                g.addColorStop(0,"#312e81");
                g.addColorStop(1,"#a855f7");
                c.fillStyle=g;c.fillRect(0,0,600,400);
                c.fillStyle="#fff";c.font="bold 48px Arial";
                c.fillText("OUR PRODUCT",105,180);
                c.font="25px Arial";c.fillText("New Product Available!",105,235);

                const imageBlob=await new Promise(resolve=>
                    canvas.toBlob(resolve,"image/jpeg",0.9)
                );

                downloadNormally("product.jpg",imageBlob,"image/jpeg");
                downloadNormally("music.wav",makeWav(),"audio/wav");

                setStatus(i,"Download started. Check browser Downloads for all 3 files.","success");
            }else{
                setStatus(i,"Download started. Check your browser Downloads.","success");
            }
        }
    }catch(e){
        console.error(e);
        setStatus(i,"Download failed. Check folder permissions and try again.","error");
    }
}

$("chooseFolder").addEventListener("click",async()=>{
    if(!window.showDirectoryPicker){
        $("folderStatus").textContent="Folder picker unavailable. Downloads will use your browser's Downloads folder.";
        $("folderStatus").className="status error";
        return;
    }

    try{
        const selected=await window.showDirectoryPicker({mode:"readwrite"});

        if(selected.name.toLowerCase()!=="htdocs"){
            $("folderStatus").textContent="Please select the actual htdocs folder.";
            $("folderStatus").className="status error";
            return;
        }

        if(!confirm("Confirm that the selected folder is C:\\xampp\\htdocs.")){
            return;
        }

        folderHandle=selected;
        $("folderStatus").textContent="htdocs folder selected. Ready to download.";
        $("folderStatus").className="status success";
    }catch(e){
        if(e.name!=="AbortError"){
            $("folderStatus").textContent="Could not select folder. Try again.";
            $("folderStatus").className="status error";
        }
    }
});

render();
</script>
</body>
</html>
